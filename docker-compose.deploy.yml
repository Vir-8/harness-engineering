# The public deployment: everything in docker-compose.yml, plus Caddy in front of the API for HTTPS.
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml --profile app up -d --build
# Only Caddy (80, 443) is reachable from outside: the cloud firewall lets nothing else in. API_HOST and HARNESS_API_KEY
# come from .env next to this file.

services:
  caddy:
    image: caddy:2.10.2
    profiles: ["app"]
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?set API_HOST in .env to the API's public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data              # the certificate, so a restart does not ask Let's Encrypt again
    depends_on:
      - api

  api:
    environment:
      # A public API must have its key: without one, anyone could spend the model credits or approve refunds.
      HARNESS_API_KEY: ${HARNESS_API_KEY:?set HARNESS_API_KEY in .env (the console sends the same value)}

  neo4j:
    environment:                      # sized for an 8 GB server shared with everything else
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m

volumes:
  caddy_data:

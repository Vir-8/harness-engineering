services:
  db:
    image: pgvector/pgvector:pg17   # Postgres 17 with the pgvector extension available
    environment:
      POSTGRES_USER: app            # dev-only credentials; Phase 10 moves real ones to Secrets Manager
      POSTGRES_PASSWORD: app
      POSTGRES_DB: refunds
    ports:
      - "5433:5432"                 # host 5433 -> container 5432 (avoids clashing with a local Postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # *.sql here runs ONCE, when the data volume is first created
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d refunds"]
      interval: 2s
      timeout: 3s
      retries: 15

  neo4j:
    image: neo4j:2026.09.0          # Community Edition (no suffix); a derived read model of Postgres, see Phase 5
    environment:
      NEO4J_AUTH: neo4j/refunds-dev # dev-only credentials (8+ characters). Ignored once /data already exists.
    ports:
      - "7474:7474"                 # Neo4j Browser: http://localhost:7474
      - "7687:7687"                 # Bolt, the protocol the Python driver speaks
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p refunds-dev 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

volumes:
  pgdata:
  neo4jdata:
